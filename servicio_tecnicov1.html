<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Servicio Técnico · Multitek</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  background: #cceeff;
  color: #0a1a1f;
}

#app {
  max-width: 430px;
  margin: 0 auto;
  background: #f4fcff;
  min-height: 100vh;
}

/* TABS */
.tabs {
  display: flex;
  background: white;
  border-bottom: 2px solid #b8e6f8;
  position: sticky;
  top: 0;
  z-index: 100;
}
.tab {
  flex: 1;
  padding: 14px;
  text-align: center;
  font-weight: 600;
  cursor: pointer;
  background: none;
  border: none;
  font-size: 15px;
  color: #7aaabb;
  border-bottom: 3px solid transparent;
}
.tab.active {
  color: #45c3f4;
  border-bottom-color: #45c3f4;
}
.tab-content {
  display: none;
}
.tab-content.active {
  display: block;
}

/* HEADER */
.header {
  background: white;
  padding: 16px;
  border-bottom: 3px solid #45c3f4;
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.header h1 {
  font-size: 20px;
}
.header h1 span {
  color: #45c3f4;
}
.header-badge {
  background: rgba(69,195,244,.12);
  padding: 4px 12px;
  border-radius: 20px;
  font-size: 11px;
  font-weight: 600;
  color: #45c3f4;
}

/* TASK CARDS */
.task-card {
  background: white;
  border: 1px solid #b8e6f8;
  border-radius: 12px;
  padding: 16px;
  margin-bottom: 12px;
  cursor: pointer;
  transition: all 0.2s;
}
.task-card:active {
  transform: scale(0.98);
}
.task-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 8px;
}
.task-title {
  font-weight: 700;
  font-size: 16px;
}
.task-status {
  font-size: 11px;
  padding: 4px 10px;
  border-radius: 20px;
  font-weight: 600;
}
.status-pending {
  background: rgba(212,130,10,.1);
  color: #d4820a;
}
.status-progress {
  background: rgba(69,195,244,.1);
  color: #0a8ab8;
}
.status-done {
  background: rgba(28,174,72,.1);
  color: #1cae48;
}
.task-desc {
  font-size: 13px;
  color: #3a6070;
  margin-bottom: 10px;
}
.task-meta {
  display: flex;
  gap: 12px;
  font-size: 11px;
  color: #7aaabb;
  flex-wrap: wrap;
  margin-top: 8px;
}
.task-progress {
  height: 4px;
  background: #b8e6f8;
  border-radius: 2px;
  margin-top: 12px;
}
.task-progress-bar {
  height: 100%;
  background: #45c3f4;
  border-radius: 2px;
  width: 0%;
}
.expense-badge {
  background: rgba(212,130,10,.1);
  padding: 2px 8px;
  border-radius: 12px;
  font-size: 10px;
  font-weight: 600;
  color: #d4820a;
}

/* MODAL */
.modal {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.6);
  backdrop-filter: blur(4px);
  z-index: 200;
  display: flex;
  align-items: flex-end;
  justify-content: center;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.25s;
}
.modal.open {
  opacity: 1;
  pointer-events: all;
}
.modal-content {
  background: white;
  width: 100%;
  max-width: 430px;
  max-height: 85vh;
  overflow-y: auto;
  border-radius: 24px 24px 0 0;
  transform: translateY(100%);
  transition: transform 0.3s;
}
.modal.open .modal-content {
  transform: translateY(0);
}
.modal-handle {
  width: 40px;
  height: 4px;
  background: #b8e6f8;
  border-radius: 2px;
  margin: 12px auto;
}
.modal-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 0 20px 8px;
}
.modal-header h3 {
  font-size: 18px;
}
.modal-close {
  font-size: 28px;
  cursor: pointer;
  color: #7aaabb;
}
.modal-body {
  padding: 8px 20px 24px;
}

/* STATUS BUTTONS */
.status-buttons {
  display: flex;
  gap: 8px;
  margin: 16px 0;
}
.status-btn {
  flex: 1;
  padding: 10px;
  border: 1px solid #b8e6f8;
  border-radius: 10px;
  background: white;
  font-weight: 600;
  font-size: 13px;
  cursor: pointer;
}
.status-btn.active {
  background: #45c3f4;
  color: white;
  border: none;
}

/* EXPENSE SECTION */
.expense-section {
  background: #edf9fe;
  border-radius: 12px;
  padding: 16px;
  margin: 16px 0;
}
.section-title {
  font-weight: 700;
  margin-bottom: 12px;
  font-size: 14px;
  display: flex;
  align-items: center;
  gap: 8px;
}
.expense-row {
  display: flex;
  gap: 8px;
  margin-bottom: 12px;
}
.expense-select {
  flex: 1;
  padding: 10px;
  border: 1px solid #b8e6f8;
  border-radius: 10px;
  background: white;
}
.expense-input {
  flex: 1;
  padding: 10px;
  border: 1px solid #b8e6f8;
  border-radius: 10px;
}
.expense-item {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 8px 0;
  border-bottom: 1px solid #b8e6f8;
}
.expense-total {
  font-weight: 700;
  margin-top: 8px;
  padding-top: 8px;
  border-top: 1px solid #b8e6f8;
}
.delete-btn {
  color: #e03030;
  cursor: pointer;
  padding: 4px 8px;
}

/* COMMENT SECTION */
.comment-input {
  display: flex;
  gap: 8px;
  margin: 12px 0;
}
.comment-input textarea {
  flex: 1;
  padding: 10px;
  border: 1px solid #b8e6f8;
  border-radius: 10px;
  font-family: inherit;
  resize: none;
}
.comment-item {
  background: #edf9fe;
  border-radius: 10px;
  padding: 10px;
  margin-bottom: 8px;
}
.comment-header {
  display: flex;
  justify-content: space-between;
  font-size: 10px;
  color: #7aaabb;
  margin-bottom: 4px;
}
.comment-text {
  font-size: 13px;
}

/* TIMER SECTION */
.timer-section {
  background: linear-gradient(135deg, #45c3f4, #2a9bcb);
  border-radius: 12px;
  padding: 16px;
  margin: 16px 0;
  color: white;
}
.timer-display {
  font-size: 36px;
  font-weight: 800;
  font-family: monospace;
  text-align: center;
}
.timer-buttons {
  display: flex;
  gap: 8px;
  margin-top: 12px;
}
.timer-btn {
  flex: 1;
  padding: 10px;
  border: none;
  border-radius: 10px;
  font-weight: 600;
  cursor: pointer;
}
.timer-start {
  background: white;
  color: #45c3f4;
}
.timer-stop {
  background: rgba(255,255,255,0.2);
  color: white;
}
.log-time-btn {
  width: 100%;
  margin-top: 12px;
  padding: 10px;
  background: #1cae48;
  color: white;
  border: none;
  border-radius: 10px;
  font-weight: 600;
  cursor: pointer;
}
.time-recorded {
  font-size: 11px;
  text-align: center;
  margin-top: 8px;
  opacity: 0.8;
}

/* EVIDENCE SECTION */
.evidence-btn {
  width: 100%;
  padding: 12px;
  background: #edf9fe;
  border: 1.5px dashed #b8e6f8;
  border-radius: 10px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
}
.evidence-list {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  margin-top: 12px;
}
.evidence-img {
  width: 70px;
  height: 70px;
  object-fit: cover;
  border-radius: 8px;
  border: 1px solid #b8e6f8;
  position: relative;
}
.evidence-delete {
  position: absolute;
  top: 2px;
  right: 2px;
  background: rgba(0,0,0,0.5);
  color: white;
  border-radius: 50%;
  width: 18px;
  height: 18px;
  font-size: 12px;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
}
.evidence-wrapper {
  position: relative;
  display: inline-block;
}

/* ACTIVITY LOG */
.activity-log {
  background: #edf9fe;
  border-radius: 12px;
  padding: 12px;
  margin-top: 16px;
  max-height: 200px;
  overflow-y: auto;
}
.activity-item {
  font-size: 11px;
  padding: 6px 0;
  border-bottom: 1px solid #b8e6f8;
  display: flex;
  gap: 8px;
}
.activity-time {
  color: #7aaabb;
  min-width: 65px;
  font-family: monospace;
}

/* CASE CARDS */
.case-card {
  background: white;
  border: 1px solid #b8e6f8;
  border-radius: 12px;
  padding: 14px;
  margin-bottom: 10px;
  cursor: pointer;
}
.case-card.done {
  opacity: 0.6;
}
.case-header {
  display: flex;
  justify-content: space-between;
  margin-bottom: 6px;
}
.case-id {
  font-family: monospace;
  font-weight: 600;
  color: #0a8ab8;
}
.pill {
  font-size: 10px;
  padding: 2px 10px;
  border-radius: 20px;
}
.pill-open {
  background: rgba(69,195,244,.12);
  color: #0a8ab8;
}
.pill-done {
  background: rgba(28,174,72,.1);
  color: #1cae48;
}

/* BUTTONS */
.btn {
  padding: 10px 16px;
  border: none;
  border-radius: 10px;
  font-weight: 600;
  cursor: pointer;
}
.btn-primary {
  background: #45c3f4;
  color: white;
}
.btn-sm {
  padding: 8px 12px;
  font-size: 12px;
}
.btn-success {
  background: #1cae48;
  color: white;
}
.lbl {
  font-size: 10px;
  font-weight: 600;
  text-transform: uppercase;
  color: #7aaabb;
  margin-bottom: 8px;
}
</style>
</head>
<body>
<div id="app">
  <!-- TABS -->
  <div class="tabs">
    <button class="tab active" onclick="switchTab('casos')">📋 Casos</button>
    <button class="tab" onclick="switchTab('tareas')">✅ Tareas</button>
  </div>

  <!-- CASOS -->
  <div id="tab-casos" class="tab-content active">
    <div class="header">
      <div><h1>MULTI<span>TEK</span></h1><div style="font-size:11px;color:#3a6070">Órdenes de Servicio</div></div>
      <div class="header-badge">Ing. Técnico</div>
    </div>
    <div style="padding:14px">
      <div class="lbl">Casos asignados</div>
      <div id="cases-list"></div>
    </div>
  </div>

  <!-- TAREAS -->
  <div id="tab-tareas" class="tab-content">
    <div class="header">
      <div><h1>MULTI<span>TEK</span></h1><div style="font-size:11px;color:#3a6070">Gestión de Tareas</div></div>
      <div class="header-badge">Seguimiento</div>
    </div>
    <div style="padding:14px" id="tasks-list"></div>
  </div>
</div>

<!-- MODAL DETALLE TAREA -->
<div id="task-modal" class="modal">
  <div class="modal-content">
    <div class="modal-handle"></div>
    <div class="modal-header">
      <h3 id="modal-title">Tarea</h3>
      <span class="modal-close" onclick="closeModal()">×</span>
    </div>
    <div class="modal-body" id="modal-body"></div>
  </div>
</div>

<script>
// ==================== DATOS ====================
let TAREAS = [
  {
    id: 'T001',
    titulo: 'Instalación Central Telefónica',
    descripcion: 'Instalación y configuración de central telefónica IP para 50 extensiones. Incluye cableado estructurado, configuración de troncales SIP.',
    prioridad: 'alta',
    status: 'progress',
    progreso: 65,
    proyecto: 'PRY-2024-0102',
    responsable: 'Carlos Mendoza',
    fechaLimite: '2025-04-10',
    comentarios: [],
    gastos: [],
    evidencias: [],
    tiempoRegistrado: 0,
    actividades: []
  },
  {
    id: 'T002',
    titulo: 'Migración Servidores Core',
    descripcion: 'Migración de servidores virtuales a nueva infraestructura. 8 servidores físicos, migración de VMs y validación de servicios.',
    prioridad: 'media',
    status: 'pending',
    progreso: 30,
    proyecto: 'PRY-2024-0042',
    responsable: 'Ana Rodríguez',
    fechaLimite: '2025-04-25',
    comentarios: [],
    gastos: [],
    evidencias: [],
    tiempoRegistrado: 0,
    actividades: []
  },
  {
    id: 'T003',
    titulo: 'Cableado Estructurado - Sede Central',
    descripcion: 'Instalación de cableado categoría 6A para 120 puntos de red. Canaletas, patch panels y certificación.',
    prioridad: 'media',
    status: 'pending',
    progreso: 45,
    proyecto: 'PRY-2024-0098',
    responsable: 'Ricardo Pérez',
    fechaLimite: '2025-04-18',
    comentarios: [],
    gastos: [],
    evidencias: [],
    tiempoRegistrado: 0,
    actividades: []
  }
];

// Agregar actividad inicial a cada tarea
TAREAS.forEach(t => {
  if(t.actividades.length === 0) {
    t.actividades.push({ accion: 'Tarea creada', fecha: new Date().toLocaleString() });
  }
});

// DATOS PARA CASOS
const CASOS = [
  { id: 'OS-2024-0318', cliente: 'TELECOMUNICACIONES DIGITALES', fecha: '2025-03-25', atendido: false },
  { id: 'OS-2024-0315', cliente: 'BANCO GENERAL S.A.', fecha: '2025-03-24', atendido: false },
  { id: 'OS-2024-0309', cliente: 'COPA AIRLINES', fecha: '2025-03-22', atendido: true }
];

// Variables globales
let currentTask = null;
let timerSeconds = 0;
let timerInterval = null;
let timerRunning = false;

// ==================== FUNCIONES ====================
function switchTab(tab) {
  const tabs = document.querySelectorAll('.tab');
  const contents = document.querySelectorAll('.tab-content');
  
  tabs.forEach(t => t.classList.remove('active'));
  contents.forEach(c => c.classList.remove('active'));
  
  if(tab === 'casos') {
    tabs[0].classList.add('active');
    document.getElementById('tab-casos').classList.add('active');
    renderCases();
  } else {
    tabs[1].classList.add('active');
    document.getElementById('tab-tareas').classList.add('active');
    renderTasks();
  }
}

function renderTasks() {
  const container = document.getElementById('tasks-list');
  if(!container) return;
  container.innerHTML = '';
  
  TAREAS.forEach(task => {
    const statusText = task.status === 'pending' ? 'Pendiente' : (task.status === 'progress' ? 'En Progreso' : 'Completada');
    const statusClass = task.status === 'pending' ? 'status-pending' : (task.status === 'progress' ? 'status-progress' : 'status-done');
    const totalGastos = task.gastos.reduce((sum, g) => sum + g.monto, 0);
    
    const div = document.createElement('div');
    div.className = 'task-card';
    div.onclick = () => openTask(task);
    div.innerHTML = `
      <div class="task-header">
        <div class="task-title">${task.titulo}</div>
        <div class="task-status ${statusClass}">${statusText}</div>
      </div>
      <div class="task-desc">${task.descripcion.substring(0, 70)}${task.descripcion.length > 70 ? '...' : ''}</div>
      <div class="task-meta">
        <span>📋 ${task.proyecto}</span>
        <span>👤 ${task.responsable}</span>
        <span>📅 ${task.fechaLimite}</span>
        ${totalGastos > 0 ? `<span class="expense-badge">💰 B/.${totalGastos}</span>` : ''}
      </div>
      <div class="task-progress">
        <div class="task-progress-bar" style="width: ${task.progreso}%"></div>
      </div>
      <div style="font-size:10px;color:#7aaabb;margin-top:6px">Progreso: ${task.progreso}%</div>
    `;
    container.appendChild(div);
  });
}

function openTask(task) {
  currentTask = task;
  document.getElementById('modal-title').textContent = task.titulo;
  renderModal();
  document.getElementById('task-modal').classList.add('open');
}

function renderModal() {
  const modalBody = document.getElementById('modal-body');
  const totalGastos = currentTask.gastos.reduce((sum, g) => sum + g.monto, 0);
  const statusText = currentTask.status === 'pending' ? 'Pendiente' : (currentTask.status === 'progress' ? 'En Progreso' : 'Completada');
  
  modalBody.innerHTML = `
    <div style="margin-bottom:16px">
      <div style="font-size:14px;color:#3a6070;margin-bottom:8px">${currentTask.descripcion}</div>
      <div class="task-meta" style="margin-bottom:8px">
        <span>📋 ${currentTask.proyecto}</span>
        <span>👤 ${currentTask.responsable}</span>
        <span>📅 ${currentTask.fechaLimite}</span>
      </div>
      <div>Estado: <strong>${statusText}</strong> | Progreso: ${currentTask.progreso}%</div>
      <div class="task-progress" style="margin-top:8px"><div class="task-progress-bar" style="width: ${currentTask.progreso}%"></div></div>
    </div>
    
    <!-- Botones de estado -->
    <div class="status-buttons">
      <button class="status-btn ${currentTask.status === 'pending' ? 'active' : ''}" onclick="updateStatus('pending')">⏳ Pendiente</button>
      <button class="status-btn ${currentTask.status === 'progress' ? 'active' : ''}" onclick="updateStatus('progress')">🔄 En Progreso</button>
      <button class="status-btn ${currentTask.status === 'done' ? 'active' : ''}" onclick="updateStatus('done')">✅ Completada</button>
    </div>
    
    <!-- Timer -->
    <div class="timer-section">
      <div class="section-title">⏱️ Registro de Tiempo</div>
      <div class="timer-display" id="timer-display">00:00:00</div>
      <div class="timer-buttons">
        <button class="timer-btn timer-start" onclick="startTimer()">▶ Iniciar</button>
        <button class="timer-btn timer-stop" onclick="stopTimer()">⏸ Pausar</button>
      </div>
      <button class="log-time-btn" onclick="logTime()">📝 Registrar tiempo trabajado</button>
      <div class="time-recorded">Tiempo registrado: ${formatTime(currentTask.tiempoRegistrado * 3600)}</div>
    </div>
    
    <!-- Gastos -->
    <div class="expense-section">
      <div class="section-title">💰 Gastos y Viáticos</div>
      <div class="expense-row">
        <select id="expense-type" class="expense-select">
          <option value="Combustible">⛽ Combustible</option>
          <option value="Viáticos">🍽️ Viáticos</option>
          <option value="Peajes">🛣️ Peajes</option>
          <option value="Estacionamiento">🅿️ Estacionamiento</option>
          <option value="Materiales">🔧 Materiales</option>
        </select>
        <input type="number" id="expense-amount" class="expense-input" placeholder="B/." step="0.01">
        <button class="btn btn-primary btn-sm" style="padding:10px 16px" onclick="addExpense()">+</button>
      </div>
      <div id="expense-list"></div>
      <div class="expense-total">Total: B/.${totalGastos.toFixed(2)}</div>
    </div>
    
    <!-- Comentarios -->
    <div>
      <div class="section-title">💬 Comentarios</div>
      <div class="comment-input">
        <textarea id="new-comment" rows="2" placeholder="Agregar comentario..."></textarea>
        <button class="btn btn-primary btn-sm" style="padding:10px 16px" onclick="addComment()">Enviar</button>
      </div>
      <div id="comments-list"></div>
    </div>
    
    <!-- Evidencias -->
    <div style="margin-top:16px">
      <div class="section-title">📸 Evidencias</div>
      <button class="evidence-btn" onclick="document.getElementById('evidence-input').click()">📷 Adjuntar foto</button>
      <input type="file" id="evidence-input" accept="image/*" style="display:none" onchange="addEvidence(this)">
      <div id="evidence-list" class="evidence-list"></div>
    </div>
    
    <!-- Actividades -->
    <div class="activity-log">
      <div class="section-title">📋 Historial</div>
      <div id="activities-list"></div>
    </div>
  `;
  
  renderExpenses();
  renderComments();
  renderEvidences();
  renderActivities();
  updateTimerDisplay();
}

function updateStatus(newStatus) {
  currentTask.status = newStatus;
  if(newStatus === 'progress' && currentTask.progreso < 30) currentTask.progreso = 30;
  if(newStatus === 'done') currentTask.progreso = 100;
  
  currentTask.actividades.unshift({
    accion: `Estado cambiado a ${newStatus === 'pending' ? 'Pendiente' : (newStatus === 'progress' ? 'En Progreso' : 'Completada')}`,
    fecha: new Date().toLocaleString()
  });
  
  renderModal();
  renderTasks();
}

function startTimer() {
  if(timerRunning) return;
  timerRunning = true;
  timerInterval = setInterval(() => {
    timerSeconds++;
    updateTimerDisplay();
  }, 1000);
}

function stopTimer() {
  if(!timerRunning) return;
  timerRunning = false;
  clearInterval(timerInterval);
}

function updateTimerDisplay() {
  const display = document.getElementById('timer-display');
  if(display) display.textContent = formatTime(timerSeconds);
}

function formatTime(seconds) {
  const hrs = Math.floor(seconds / 3600);
  const mins = Math.floor((seconds % 3600) / 60);
  const secs = seconds % 60;
  return `${hrs.toString().padStart(2,'0')}:${mins.toString().padStart(2,'0')}:${secs.toString().padStart(2,'0')}`;
}

function logTime() {
  const horas = timerSeconds / 3600;
  currentTask.tiempoRegistrado += horas;
  currentTask.actividades.unshift({
    accion: `Tiempo registrado: ${formatTime(timerSeconds)} (${horas.toFixed(2)} horas)`,
    fecha: new Date().toLocaleString()
  });
  timerSeconds = 0;
  timerRunning = false;
  clearInterval(timerInterval);
  updateTimerDisplay();
  renderModal();
  renderTasks();
}

function addExpense() {
  const tipo = document.getElementById('expense-type').value;
  const monto = parseFloat(document.getElementById('expense-amount').value);
  
  if(isNaN(monto) || monto <= 0) {
    alert('Ingresa un monto válido');
    return;
  }
  
  currentTask.gastos.push({
    tipo: tipo,
    monto: monto,
    fecha: new Date().toLocaleDateString()
  });
  
  currentTask.actividades.unshift({
    accion: `Gasto registrado: ${tipo} - B/.${monto.toFixed(2)}`,
    fecha: new Date().toLocaleString()
  });
  
  document.getElementById('expense-amount').value = '';
  renderExpenses();
  renderActivities();
  renderTasks();
}

function renderExpenses() {
  const container = document.getElementById('expense-list');
  if(!container) return;
  
  if(currentTask.gastos.length === 0) {
    container.innerHTML = '<div style="font-size:12px;color:#7aaabb;text-align:center">No hay gastos registrados</div>';
    return;
  }
  
  container.innerHTML = currentTask.gastos.map((g, idx) => `
    <div class="expense-item">
      <div><strong>${g.tipo}</strong><br><span style="font-size:10px;color:#7aaabb">${g.fecha}</span></div>
      <div><strong>B/.${g.monto.toFixed(2)}</strong></div>
      <div class="delete-btn" onclick="deleteExpense(${idx})">🗑️</div>
    </div>
  `).join('');
}

function deleteExpense(idx) {
  currentTask.gastos.splice(idx, 1);
  currentTask.actividades.unshift({
    accion: `Gasto eliminado`,
    fecha: new Date().toLocaleString()
  });
  renderExpenses();
  renderActivities();
  renderTasks();
}

function addComment() {
  const textarea = document.getElementById('new-comment');
  const texto = textarea.value.trim();
  
  if(!texto) {
    alert('Escribe un comentario');
    return;
  }
  
  currentTask.comentarios.push({
    usuario: currentTask.responsable,
    texto: texto,
    fecha: new Date().toLocaleString()
  });
  
  currentTask.actividades.unshift({
    accion: `Comentario: "${texto.substring(0, 50)}${texto.length > 50 ? '...' : ''}"`,
    fecha: new Date().toLocaleString()
  });
  
  textarea.value = '';
  renderComments();
  renderActivities();
}

function renderComments() {
  const container = document.getElementById('comments-list');
  if(!container) return;
  
  if(currentTask.comentarios.length === 0) {
    container.innerHTML = '<div style="font-size:12px;color:#7aaabb;text-align:center">No hay comentarios</div>';
    return;
  }
  
  container.innerHTML = currentTask.comentarios.map(c => `
    <div class="comment-item">
      <div class="comment-header">
        <strong>${c.usuario}</strong>
        <span>${c.fecha}</span>
      </div>
      <div class="comment-text">${c.texto}</div>
    </div>
  `).join('');
}

function addEvidence(input) {
  if(!input.files[0]) return;
  const file = input.files[0];
  const reader = new FileReader();
  
  reader.onload = e => {
    currentTask.evidencias.push({
      url: e.target.result,
      nombre: file.name,
      fecha: new Date().toLocaleString()
    });
    currentTask.actividades.unshift({
      accion: `Evidencia adjuntada: ${file.name}`,
      fecha: new Date().toLocaleString()
    });
    renderEvidences();
    renderActivities();
  };
  reader.readAsDataURL(file);
  input.value = '';
}

function renderEvidences() {
  const container = document.getElementById('evidence-list');
  if(!container) return;
  
  if(currentTask.evidencias.length === 0) {
    container.innerHTML = '';
    return;
  }
  
  container.innerHTML = currentTask.evidencias.map((e, idx) => `
    <div class="evidence-wrapper">
      <img src="${e.url}" class="evidence-img">
      <div class="evidence-delete" onclick="deleteEvidence(${idx})">×</div>
    </div>
  `).join('');
}

function deleteEvidence(idx) {
  currentTask.evidencias.splice(idx, 1);
  currentTask.actividades.unshift({
    accion: `Evidencia eliminada`,
    fecha: new Date().toLocaleString()
  });
  renderEvidences();
  renderActivities();
}

function renderActivities() {
  const container = document.getElementById('activities-list');
  if(!container) return;
  
  if(currentTask.actividades.length === 0) {
    container.innerHTML = '<div style="font-size:12px;color:#7aaabb;text-align:center">No hay actividades</div>';
    return;
  }
  
  container.innerHTML = currentTask.actividades.slice(0, 15).map(a => `
    <div class="activity-item">
      <div class="activity-time">${a.fecha.substring(5,16)}</div>
      <div>${a.accion}</div>
    </div>
  `).join('');
}

function closeModal() {
  if(timerRunning) {
    stopTimer();
    timerSeconds = 0;
  }
  document.getElementById('task-modal').classList.remove('open');
  currentTask = null;
}

function renderCases() {
  const container = document.getElementById('cases-list');
  if(!container) return;
  container.innerHTML = CASOS.map(caso => `
    <div class="case-card ${caso.atendido ? 'done' : ''}">
      <div class="case-header">
        <div class="case-id">${caso.id}</div>
        <div class="pill ${caso.atendido ? 'pill-done' : 'pill-open'}">${caso.atendido ? '✓ Atendido' : '● Abierto'}</div>
      </div>
      <div class="case-client" style="font-weight:600">${caso.cliente}</div>
      <div class="case-meta" style="font-size:11px;color:#7aaabb;margin-top:4px">📅 ${caso.fecha}</div>
    </div>
  `).join('');
}

// Inicializar
renderCases();
renderTasks();
</script>
</body>
</html>
